<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0f1117" />
<title>Motor de Rol</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f1117;color:#e8e6e3;font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:12px}
.card{overflow-wrap:anywhere;background:#181b24;border:1px solid #2a2f3d;border-radius:12px;padding:12px;margin:10px 0}
.btn{background:#2b3350;color:#fff;border:1px solid #3a4468;border-radius:10px;padding:10px 12px;font-size:15px;cursor:pointer;text-align:left}
.btn:hover{background:#36406a}.btn:disabled{opacity:.5}
.btn.main{background:#7a5af8;border-color:#7a5af8}
.btn.danger{background:#5b2230;border-color:#7a2d40}
.btn.small{padding:5px 9px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:#0f1117;color:#e8e6e3;border:1px solid #333a4d;border-radius:8px;padding:9px;font-size:15px;width:100%;font-family:inherit}
label{display:block;font-size:13px;color:#9aa3b8;margin:10px 0 3px}
h1,h2,h3{margin:6px 0}
.tag{display:inline-block;background:#232840;border-radius:6px;padding:2px 7px;font-size:12px;color:#b9c2dd}
.bar{height:8px;background:#232840;border-radius:4px;overflow:hidden}.bar>div{height:100%}
.roll{border-radius:8px;padding:6px 10px;font-weight:600;display:inline-block;margin-bottom:6px}
.ok{background:#173d2a;color:#7ee0a5}.ko{background:#44202a;color:#ff9aa9}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #2a2f3d;padding:4px;text-align:left;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding-bottom:6px}
.tabs .btn{text-align:center;padding:8px 2px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.narr{white-space:pre-wrap;font-size:17px}
</style>
</head>
<body><div id="root"></div></body>
</html>
